name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            cd /var/www/telepro3

            git fetch origin
            git reset --hard origin/main

            cd backend
            npm install
            pm2 restart telepro3-backend --update-env

            cd ../frontend
            npm install
            npm run build

            systemctl reload nginx

            echo "Deployment Successful"
